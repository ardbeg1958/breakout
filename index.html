 case 14:return D(14,{name:'シフティング・ウォール',tags:['移動壁'],rows:ARTS.rocket.rows,hue:palFn(ARTS.rocket.pal,11),
   extras:{walls:[{y:272,w:90,ph:0,w_:0.9},{y:292,w:90,ph:Math.PI,w_:0.9}]}});

function bossDef(n,variant,tier){
 const bm=BOSSMAPS[variant%3];
 const sfx=tier>=3?' '+(ROMAN[Math.min(10,Math.floor(tier/3)+1)]||''):'';
 return {name:bm.name+(variant>=3?(' '+(ROMAN[Math.min(10,Math.floor(n/15)+1)])):''),tags:['ボス'],rows:bm.rows,x0:BOSSX0,y0:BOSSY0,boss:{hue:bm.hue,tier,sway:bm.sway+Math.min(14,tier*3),hp:5+Math.min(8,Math.floor(tier*1.5)),shellHp:tier>=4?3:2},extras:{}};
}
function genBoss(n,rr){
 const k=n/5, variant=(k-1)%3, tier=k-1;
 const d=bossDef(n,variant,tier);d.n=n;d.spd=ballSpeed(n);
 d.name=BOSSMAPS[variant].name+' '+(ROMAN[Math.min(10,Math.floor(tier/3)+1)]||'X');
 if(tier>=4){d.extras.orbits=[{cx:180,cy:280,R:38,n:Math.min(7,4+Math.floor(tier/3)),w:1.1,hp:1,hue:BOSSMAPS[variant].hue+40}];d.tags.push('回転')}
 if(tier>=6){d.extras.walls=[{y:330,w:80,ph:0,w_:1.0}];d.tags.push('移動壁')}
 return d;
}
function genLevel(n){
 const rr=mulberry((n*2654435761)>>>0^0x9e3779b9);
 const rn=(a,b)=>a+Math.floor(rr()*(b-a+1)),chance=p=>rr()<p;
 if(n%5===0)return genBoss(n,rr);
 const d=n-15,def={n,spd:ballSpeed(n),tags:[],extras:{}};
 let g,name,hue;
 const baseH=rn(0,359),spread=rn(14,40);
 if(chance(0.55)){
  const keys=Object.keys(ARTS),a=ARTS[keys[rn(0,keys.length-1)]];
  g=a.rows.map(s=>s.split(''));name=a.name;
  hue=chance(0.5)?palFn(a.pal,g.length):(r=>baseH+r*spread);
 }else{
  const nr=rn(6,8+Math.min(3,Math.floor(d/6))),dens=0.74+rr()*0.14;g=[];
  for(let r=0;r<nr;r++){const half=[];for(let c=0;c<6;c++)half.push((r===0||chance(dens))?'#':'.');
   const row=[];for(let c=0;c<11;c++)row.push(half[c<=5?c:10-c]);g.push(row)}
  name=NOISENAMES[rn(0,NOISENAMES.length-1)];
  hue=chance(0.5)?rainbow:(r=>baseH+r*spread);
 }
 const nrows=g.length,cellsOf=ch=>{const o=[];for(let r=0;r<nrows;r++)for(let c=0;c<11;c++)if(g[r][c]===ch)o.push([r,c]);return o};
 const sym=(r,c,ch)=>{if(g[r][c]!=='.'){g[r][c]=ch;g[r][10-c]=ch}};
 const pool=['armor','steel','explosive','moving','regen','portal','well','bumper','orbit','walls'];
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(rr()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
 const k=1+(d>5?1:0)+(d>12?1:0)+(d>22&&chance(0.5)?1:0);
 const yB=Y0+nrows*CH,ex=def.extras;
 const chosen=pool.slice(0,k),hasO=chosen.includes('orbit'),hasW=chosen.includes('walls');
 const zmin=yB+(hasO?195:hasW?90:30),zlow=Math.min(yB+(hasO?215:hasW?110:80),440);
 let wantMoving=false,wallsUsed=false,orbitUsed=false;
 for(let i=0;i<k;i++){const gm=pool[i];
  if(gm==='armor'){const f=Math.min(0.5,0.14+0.015*d);for(let r=0;r<nrows;r++)for(let c=0;c<=5;c++)if(g[r][c]==='#'&&chance(f)){const ch=(d>10&&chance(0.3))?'B':'A';g[r][c]=ch;g[r][10-c]=ch}def.tags.push('アーマー')}
  else if(gm==='steel'){const m=rn(2,3+Math.min(3,Math.floor(d/6)));for(let j=0;j<m;j++){const r=rn(0,nrows-1),c=chance(0.6)?rn(0,2):rn(0,5);if(g[r][c]!=='.')sym(r,c,'S')}def.tags.push('鋼鉄')}
  else if(gm==='explosive'){const m=rn(2,4);for(let j=0;j<m;j++){const r=rn(1,nrows-1),c=rn(0,5);sym(r,c,'X');if(chance(0.5)&&c+1<=5&&r+1<nrows&&g[r+1][c]!=='.')sym(r+1,c,'X')}def.tags.push('ばくだん')}
  else if(gm==='moving'){wantMoving=true;def.tags.push('スライド')}
  else if(gm==='regen'){const m=rn(2,4);for(let j=0;j<m;j++){const r=rn(1,nrows-1),c=rn(0,5);if(g[r][c]==='#')sym(r,c,'R')}def.tags.push('再生')}
  else if(gm==='portal'){const m=chance(0.5)?2:1;ex.portals=[];const pts=[];const ok=(x,y)=>pts.every(q=>Math.hypot(q[0]-x,q[1]-y)>80);for(let j=0;j<m;j++){let tries=0,pr=null;while(tries++<40){const y1=Math.min(zlow+rn(0,30),465),y2=Math.max(zmin,zlow-rn(50,100)),xa=rn(40,150),xb=clamp(W-xa+rn(-30,30),40,320);if(ok(xa,y1)&&ok(xb,y2)&&Math.hypot(xa-xb,y1-y2)>80){pr={x:xa,y:y1,x2:xb,y2:y2};break}}if(pr){pts.push([pr.x,pr.y],[pr.x2,pr.y2]);ex.portals.push(pr)}}if(ex.portals.length)def.tags.push('ポータル')}
  else if(gm==='well'){ex.wells=[];const m=rn(1,2);for(let j=0;j<m;j++)ex.wells.push({x:rn(70,290),y:zlow+rn(0,40),s:(chance(0.5)?1:-1)*rn(800,1100),R:100});def.tags.push('重力')}
  else if(gm==='bumper'){ex.bumpers=[];const m=rn(2,3);for(let j=0;j<m;j++)ex.bumpers.push({x:rn(60,300),y:zlow+rn(0,40),r:12});def.tags.push('バンパー')}
  else if(gm==='orbit'){orbitUsed=true;ex.orbits=[{cx:180,cy:yB+120,R:rn(34,44),n:rn(5,7),w:(chance(0.5)?1:-1)*(0.9+rr()*0.5),hp:1+(d>14&&chance(0.4)?1:0),hue:rn(0,359)}];def.tags.push('回転')}
  else if(gm==='walls'){wallsUsed=true;ex.walls=[{y:yB+30,w:90,ph:0,w_:0.8+rr()*0.4}];if(d>8)ex.walls.push({y:yB+50,w:90,ph:Math.PI,w_:0.8+rr()*0.4});def.tags.push('移動壁')}
 }
 if(orbitUsed&&ex.portals)ex.portals.forEach(p=>{p.y2=Math.max(p.y2,yB+170)});
 for(let r=1;r<nrows;r++)for(let c=0;c<11;c++)if(g[r][c]==='S'&&g[r-1][c]!=='.'&&g[r-1][c]!=='S')g[r][c]='A';
 pruneUnreachable(g);
 if(wantMoving){const m=rn(1,Math.min(3,1+Math.floor(d/8))),cands=[];
  for(let r=1;r<nrows;r++){const row=g[r];if(row.some(x=>x!=='.')&&row.every(x=>x==='.'||x==='#'||x==='A'))cands.push(r)}
  for(let j=0;j<m&&cands.length;j++){const r=cands.splice(rn(0,cands.length-1),1)[0];for(let c=0;c<11;c++)if(g[r][c]==='#')g[r][c]='M';else if(g[r][c]==='A')g[r][c]='N'}}
 def.rows=g.map(r=>r.join(''));def.hue=hue;def.name=name;
 if(def.tags.length===0)def.tags.push('');
 return def;
}
function pruneUnreachable(g){
 const nr=g.length,seen=g.map(r=>r.map(()=>false)),q=[];
 for(let c=0;c<11;c++){if(g[0][c]!=='S'){seen[0][c]=true;q.push([0,c])}if(g[nr-1][c]!=='S'&&!seen[nr-1][c]){seen[nr-1][c]=true;q.push([nr-1,c])}}
 while(q.length){const [r,c]=q.pop();for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const y=r+dr,x=c+dc;if(y<0||y>=nr||x<0||x>10||seen[y][x]||g[y][x]==='S')continue;seen[y][x]=true;q.push([y,x])}}
 for(let r=0;r<nr;r++)for(let c=0;c<11;c++)if(!seen[r][c]&&g[r][c]!=='S')g[r][c]='.';
}
function buildDef(n){return n<=15?designed(n):genLevel(n)}
function levelTags(def){return def.tags.filter(Boolean)}

/* ---------- instantiate ---------- */
function mkBrick(o){const b={id:bricks.length,x:0,y:0,bx:0,by:0,sx:0,sy:0,w:CW,h:CH,kind:'n',hp:1,maxhp:1,hue:200,alive:true,req:true,mv:null,pend:-1,pdmg:0,drop:false,flash:0,regen:false,regenT:-1,regenUsed:false,fcd:0,boss:false,appear:0,core:false,crack:0,gx:0};
 Object.assign(b,o);b.x=b.bx=o.x;b.y=b.by=o.y;b.sx=b.x;b.sy=b.y;bricks.push(b);return b}
function gridAdd(b){const x0=Math.max(0,Math.floor(b.x/GS)),x1=Math.min(GCOLS-1,Math.floor((b.x+b.w)/GS)),y0=Math.max(0,Math.floor(b.y/GS)),y1=Math.floor((b.y+b.h)/GS);
 for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++){const k=cy*GCOLS+cx;(grid[k]||(grid[k]=[])).push(b)}}
const _mxy={x:0,y:0};
function moverXY(b,t){const m=b.mv;
 if(m.k==='slide'){_mxy.x=b.bx+m.lo+(m.hi-m.lo)*(0.5+0.5*Math.sin(m.w*t+m.ph));_mxy.y=b.by}
 else if(m.k==='orb'){const a=m.a0+m.w*t;_mxy.x=m.cx+Math.cos(a)*m.R-b.w/2;_mxy.y=m.cy+Math.sin(a)*m.R-b.h/2}
 else{const g=m.g;_mxy.x=b.bx+g.amp*Math.sin(g.w*t);_mxy.y=b.by+g.bob*Math.sin(g.w*0.7*t+1)}
}
function setMoversAt(t){for(let i=0;i<movers.length;i++){const b=movers[i];moverXY(b,t);b.x=_mxy.x;b.y=_mxy.y}}

function instantiate(def){
 bricks=[];movers=[];grid=[];portals=[];wells=[];bumpers=[];boss=null;
 const rows=def.rows||[],x0=def.x0!==undefined?def.x0:X0,y0=def.y0||Y0;
 const hueFn=typeof def.hue==='function'?def.hue:(typeof def.hue==='number'?(()=>def.hue):rainbow);
 const rowGroups={};let coreMin=null,coreMax=null;
 for(let r=0;r<rows.length;r++){
  for(let c=0;c<rows[r].length;c++){
   const ch=rows[r][c];if(ch==='.'||ch===' ')continue;
   const x=x0+c*CW,y=y0+r*CH,h=hueFn(r,c);
   if(ch==='C'){if(!coreMin)coreMin=[r,c],coreMax=[r,c];else{coreMin=[Math.min(coreMin[0],r),Math.min(coreMin[1],c)];coreMax=[Math.max(coreMax[0],r),Math.max(coreMax[1],c)]}continue}
   let b;
   if(ch==='#')b=mkBrick({x,y,hue:h});
   else if(CHARHUE[ch]!==undefined)b=mkBrick({x,y,hue:CHARHUE[ch]});
   else if(ch==='A')b=mkBrick({x,y,hue:h,kind:'a',hp:2,maxhp:2});
   else if(ch==='B')b=mkBrick({x,y,hue:h,kind:'a',hp:3,maxhp:3});
   else if(ch==='S')b=mkBrick({x,y,hue:210,kind:'s',req:false,hp:99,maxhp:99});
   else if(ch==='X')b=mkBrick({x,y,hue:18,kind:'x'});
   else if(ch==='R')b=mkBrick({x,y,hue:h,regen:true});
   else if(ch==='M'||ch==='N'){b=mkBrick({x,y,hue:h,kind:ch==='N'?'a':'n',hp:ch==='N'?2:1,maxhp:ch==='N'?2:1});(rowGroups[r]||(rowGroups[r]=[])).push(b)}
   if(def.boss&&b&&b.kind!=='s'&&b.kind!=='x'){b.boss=true;b.req=false;b.hue=def.boss.hue;if(b.kind==='a'){b.hp=b.maxhp=def.boss.shellHp}}
   else if(def.boss&&b&&b.kind==='x'){b.boss=true;b.req=false}
   if(def.boss&&b&&b.kind==='s')b.boss=true;
  }
 }

 const x0=Math.max(0,((b.x-R)/GS)|0),x1=Math.min(GCOLS-1,((b.x+R)/GS)|0),y0=Math.max(0,((b.y-R)/GS)|0),y1=Math.min(22,((b.y+R)/GS)|0);
 for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++){const l=grid[cy*GCOLS+cx];if(l)for(let i=0;i<l.length;i++)cand.push(l[i])}

}
function bvalue(c){let v=1;

function simHit(c,dmg,fire){const S=SIM,id=c.id;
 if(c.kind==='s'){S.score-=0.25;return}
 if(S.hs[id]!==S.stamp){S.hs[id]=S.stamp;S.hp[id]=c.hp}
 if(fire){S.fh[id]=S.stamp;dmg=c.core?1:99}

function fixAngle(b){const m=0.2*b.sp;

function stepBall(b,tt,sim){
 const S=sim?SIM:null;
 if(wells.length){let act=false;
  for(let i=0;i<wells.length;i++){const w=wells[i],dx=w.x-b.x,dy=w.y-b.y,d2=dx*dx+dy*dy;
   if(d2<w.R2&&d2>36){const d=Math.sqrt(d2),f=w.s*(1-d/w.R)*DT/d;b.vx+=dx*f;b.vy+=dy*f;act=true}}
  if(act){const k=b.sp/Math.hypot(b.vx,b.vy);b.vx*=k;b.vy*=k;if(Math.abs(b.vy)<0.2*b.sp)fixAngle(b)}}
 b.x+=b.vx*DT;b.y+=b.vy*DT;
 let hit=false;
 if(b.x<R){b.x=R;if(b.vx<0){b.vx=-b.vx;hit=true}}else if(b.x>W-R){b.x=W-R;if(b.vx>0){b.vx=-b.vx;hit=true}}
 if(b.y<TOP+R){b.y=TOP+R;if(b.vy<0){b.vy=-b.vy;hit=true}}
 if(hit){b.ver++;fixAngle(b);if(!sim)wallHit(b)}
 if(b.vy>0&&b.y+R>=PY){
  if(sim){S.land=true;S.lx=b.x;return}
  if(b.y-R<=PY+PH&&Math.abs(b.x-paddle.x)<=paddle.hw+R*0.6){paddleHit(b);return}
 }
 if(b.pcd>0)b.pcd-=DT;
 else if(portals.length&&b.pc<3){for(let i=0;i<portals.length;i++){const p=portals[i],dx=b.x-p.x,dy=b.y-p.y;

 for(let i=0;i<bumpers.length;i++){const bp=bumpers[i],dx=b.x-bp.x,dy=b.y-bp.y,rr=bp.r+R,d2=dx*dx+dy*dy;

  if(boss){const g=boss.g;g.amp+=(g.ampT-g.amp)*Math.min(1,dt*1.2)}
 }

  // stuck balls follow paddle
  for(const b of balls)if(b.stuck){b.x=paddle.x+b.off;b.y=PY-R;if(b.wait<=0&&b.wait!==-99){}}
  for(let s=0;s<4;s++){

   for(let i=0;i<balls.length;i++){const b=balls[i];if(b.stuck)continue;stepBall(b,G.tt,false)}

   if(b.y>H+14){balls.splice(i,1)}}

const VMAX=780,ACC=7000;
const AI={lastU:0,plan:null,tx:W/2,cur:null,sweepT:0,sweepX:W/2,rng:mulberry(777)};
const arnd=()=>AI.rng();
function chooseU(x,t0,sp,fire,launch){
 const us=[-0.9,-0.6,-0.3,0,0.3,0.6,0.9];
 // priority targets: aim analytically at the most valuable bricks (last bricks, boss core, bombs, armor)
 const live=reqList.filter(b=>b.alive);
 if(live.length){
  const sc=live.map(b=>({b,v:bvalue(b)+arnd()*0.8}));
  sc.sort((p,q)=>q.v-p.v);
  for(let i=0;i<Math.min(4,sc.length);i++){const b=sc[i].b,cx=b.x+b.w/2,cy=b.y+b.h/2,dy=PY-cy;
   for(const tx of[cx,2*R-cx,2*(W-R)-cx]){const a=Math.atan2(tx-x,dy),u=a/MAXA;if(Math.abs(u)<=0.95)us.push(u)}}
 }
 if(live.length&&(live.length<=4||G.noProg>8)){for(let u=-0.95;u<=0.951;u+=0.05)us.push(u)}
 let best=0,bs=-1e9,second=0,ss=-1e9;
 for(const u of us){const a=u*MAXA;
  const S=simulate(x,PY-R-1,sp*Math.sin(a),-sp*Math.cos(a),sp,t0,700,fire);
  let s=S.score+arnd()*0.4;
  if(S.land){const nt=S.steps*DT,need=Math.abs(S.lx-x)/(VMAX*0.6);if(nt<need+0.12)s-=3;s-=0.3*Math.abs(S.lx-W/2)/(W/2)}
  if(s>bs){second=best;ss=bs;best=u;bs=s}else if(s>ss){second=u;ss=s}}
 if(bs<0.4){ // nothing predicted to be hit: explore a different angle instead of repeating the same path
  let u2=best;for(let i=0;i<6;i++){u2=(arnd()*2-1)*0.85;if(Math.abs(u2-AI.lastU)>0.25)break}best=u2}
 AI.lastU=best;
 if(!launch&&arnd()<0.08&&ss>-1e8&&bs>=0.4)return second;
 return best;
}
function aiUpdate(dt){
 for(const b of balls)if(b.stuck){b.wait-=dt;if(b.wait<=0)launchBall(b)}
 let cur=null,best=1e9;
 for(const b of balls){if(b.stuck)continue;
  if(b.pv!==b.ver||G.tt-b.pt>0.3){const s=simulate(b.x,b.y,b.vx,b.vy,b.sp,G.tt,2800,b.fire,b.pc);b.pl=s.land?{x:s.lx,t:G.tt+s.steps*DT}:null;b.pv=b.ver;b.pt=G.tt}
  if(b.pl&&b.pl.t<best){best=b.pl.t;cur=b}}

function paddleAI(dt){
 const cur=G.state==='play'?AI.cur:null;
 let X,tL=9,xL=W/2;
 if(cur){
  tL=cur.pl.t-G.tt;xL=cur.pl.x;
  let pl=AI.plan;
  if(tL<1.9){
   const fresh=!pl||pl.ball!==cur.id||pl.pv!==cur.pv;
   if(fresh||(pl.bv!==G.brickVer&&G.tt-pl.time>0.4)){
    const u=chooseU(xL,cur.pl.t,cur.sp,cur.fire);
    if(fresh){let side=arnd()<0.5?-1:1;let miss=G.lives>=4&&G.lvl>=3&&balls.length===1&&arnd()<0.012;
     if(miss){const hw=paddle.hw,off=hw+R+10;if(xL+side*off<hw||xL+side*off>W-hw)side=-side;if(xL+side*off<hw||xL+side*off>W-hw)miss=false;else STATS.deliberateMisses++}
     AI.plan={ball:cur.id,pv:cur.pv,bv:G.brickVer,time:G.tt,u,lazy:arnd()<0.22,miss,side}}
    else{pl.u=u;pl.bv=G.brickVer;pl.time=G.tt}
   }
  }
  pl=AI.plan;
  const hw=paddle.hw;
  const has=pl&&pl.ball===cur.id&&pl.pv===cur.pv&&tL<1.9;
  X=clamp(xL-(has?pl.u:0)*hw,hw,W-hw);
  if(has){
   if(pl.miss)X=clamp(xL+pl.side*(hw+R+10),hw,W-hw);
   else if(pl.lazy&&tL>0.1){const need=Math.abs(X-paddle.x)/(VMAX*0.6);if(tL-need>0.22)X=paddle.x}
  }
  if(tL>1.2)X+=7*Math.sin(G.time*1.7);
  if(AI.sab)X=xL<W/2?W-paddle.hw:paddle.hw;
  // side quests
  let bc=null,bt=9;
  for(const c of capsules){const tc=(PY-c.y-7)/c.vy;if(tc<0.04||tc>=bt)continue;
   if(Math.abs(c.x-paddle.x)>VMAX*0.55*tc)continue;
   if(tc<tL){if(Math.abs(xL-c.x)>VMAX*0.55*(tL-tc)-10)continue}
   else if(tc>tL+0.1)continue;
   bc=c;bt=tc}
  if(bc&&bt<tL)X=clamp(bc.x,paddle.hw,W-paddle.hw);
  else if(G.pw.laser>0&&tL>1.15&&reqList.length){
   AI.sweepT-=dt;if(AI.sweepT<=0){AI.sweepT=1.2;const l=reqList.filter(b=>b.alive);if(l.length){const b=l[Math.floor(arnd()*l.length)];AI.sweepX=b.x+b.w/2}}
   const sx=AI.sweepX,room=VMAX*0.5*(tL-0.5);
   if(Math.abs(sx-paddle.x)<room&&Math.abs(xL-sx)<room)X=clamp(sx,hw,W-hw)}
 }else{
  let bc=null;
  if(G.state==='play')for(const c of capsules){if(c.y>PY-260&&Math.abs(c.x-paddle.x)<VMAX*0.5*((PY-c.y)/c.vy)){bc=c;break}}
  if(bc)X=clamp(bc.x,paddle.hw,W-paddle.hw);
  else X=W/2+60*Math.sin(G.time*0.6)+(G.state==='over'?0:0);

}

  g.globalAlpha=1;
 }
 if(G.nameT2>0&&G.nameText2){g.globalAlpha=Math.min(1,G.nameT2*1.5);g.save();g.shadowColor=hsl(350,100,55);g.shadowBlur=14*K;g.fillStyle='#fff';g.font=`bold 20px ${FONT_MONO}`;spaced(g,G.nameText2,W/2,430,4);g.restore();g.globalAlpha=1}
 if(G.state==='clear'){const u=Math.min(1,G.stateT/0.35),sc=0.7+0.3*(1-Math.pow(1-u,3));
  g.save();g.translate(W/2,360);g.scale(sc,sc);g.globalAlpha=Math.min(1,u*1.5)*Math.min(1,(2.6-G.stateT)*2);g.shadowColor=hsl(HUEBG()+150,100,60);g.shadowBlur=18*K;g.fillStyle='#fff';g.font=`bold 34px ${FONT_MONO}`;spaced(g,def&&def.boss?'BOSS DOWN!':'CLEAR!',0,0,6);
  g.shadowBlur=0;g.fillStyle='rgba(210,225,255,.85)';g.font=`bold 12px ${FONT_MONO}`;spaced(g,'BONUS +'+G.clearBonus,0,30,2);g.restore()}
 if(G.state==='over'){
  const u=Math.min(1,G.stateT/0.6);g.fillStyle=`rgba(2,0,10,${0.6*u})`;g.fillRect(0,TOP,W,H-TOP);
  g.globalAlpha=u;g.save();g.shadowColor=hsl(350,100,55);g.shadowBlur=18*K;g.fillStyle='#fff';g.font=`bold 36px ${FONT_MONO}`;spaced(g,'GAME OVER',W/2,260,5);g.restore();
  g.fillStyle='rgba(210,225,255,.9)';g.font=`14px ${FONT_MONO}`;spaced(g,'SCORE  '+String(Math.floor(G.score)).padStart(7,'0'),W/2,318,2);
  g.fillStyle=hsl(50,100,68,0.95);g.font=`bold 15px ${FONT_MONO}`;spaced(g,'HIGH SCORE  '+String(Math.floor(G.hi)).padStart(7,'0'),W/2,348,2);
  g.fillStyle='rgba(210,225,255,.6)';g.font=`12px ${FONT_MONO}`;spaced(g,'REACHED  LEVEL '+G.lvl,W/2,378,2);
  if(G.stateT>3.2){g.globalAlpha=0.5+0.5*Math.sin(G.stateT*7);g.fillStyle='#fff';g.font=`bold 16px ${FONT_MONO}`;spaced(g,'NEW GAME',W/2,430,5)}
  g.globalAlpha=1}
}
/* ================= audio ================= */
let actx=null,soundOn=store('breakout_snd')==='1',noiseBuf=null;const lastSfx={};
function ensureAudio(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){actx=null}}if(actx&&actx.state==='suspended')actx.resume().catch(()=>{})}
function tone(f,d,type,vol,f2,delay){if(!actx)return;const t=actx.currentTime+(delay||0),o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+0.02)}
function noise(d,vol,lp){if(!actx)return;if(!noiseBuf){noiseBuf=actx.createBuffer(1,actx.sampleRate*0.5,actx.sampleRate);const a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
 const t=actx.currentTime,s=actx.createBufferSource(),g=actx.createGain(),f=actx.createBiquadFilter();s.buffer=noiseBuf;f.type='lowpass';f.frequency.value=lp||1200;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(f);f.connect(g);g.connect(actx.destination);s.start(t);s.stop(t+d)}
function sfx(n,p){if(!soundOn||!actx||actx.state!=='running')return;const now=actx.currentTime;if(lastSfx[n]&&now-lastSfx[n]<0.03)return;lastSfx[n]=now;
 switch(n){
  case'wall':tone(180,0.05,'square',0.035,150);break;
  case'paddle':tone(260,0.07,'triangle',0.08,330);break;
  case'hit':tone(520+((p||0)%200)*2,0.06,'square',0.04);break;
  case'break':tone(660+((p||0)%240)*3,0.09,'square',0.05,990);break;
  case'boom':noise(0.4,0.12,900);tone(120,0.3,'sawtooth',0.06,40);break;
  case'steel':tone(900,0.04,'square',0.025,700);break;
  case'bump':tone(420,0.1,'sine',0.07,840);break;
  case'portal':tone(300,0.18,'sine',0.06,900);break;
  case'power':[520,660,880].forEach((f,i)=>tone(f,0.09,'square',0.05,0,i*0.07));break;
  case'laser':tone(1100,0.07,'sawtooth',0.02,300);break;
  case'launch':tone(330,0.1,'triangle',0.06,660);break;
  case'lose':tone(300,0.5,'sawtooth',0.07,60);break;
  case'regen':tone(440,0.15,'triangle',0.05,880);break;
  case'phase':noise(0.7,0.12,600);tone(90,0.7,'sawtooth',0.08,200);break;
  case'clear':[523,659,784,1047].forEach((f,i)=>tone(f,0.16,'square',0.05,0,i*0.1));break;
 }}
function setSound(on){soundOn=on;store('breakout_snd',on?'1':'0');if(on){ensureAudio();setTimeout(()=>sfx('power'),60)}}

/* ================= loop / input ================= */
let acc=0,lastTs=0,hiddenPause=false;
function frame(ts){
 requestAnimationFrame(frame);
 if(hiddenPause){lastTs=0;return}
 if(!lastTs)lastTs=ts;let dt=(ts-lastTs)/1000;lastTs=ts;if(!(dt>0))dt=0;dt=Math.min(dt,0.1);
 if(G.slowT>0)G.slowT-=dt;
 acc+=dt*(G.slowT>0?0.3:1);let n=0;
 while(acc>=1/60&&n<6){tick(1/60);acc-=1/60;n++}
 if(n>=6)acc=0;
 render();
}
document.addEventListener('visibilitychange',()=>{hiddenPause=document.hidden;lastTs=0;if(!document.hidden)acc=0});
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,150));
function toggleFs(){const d=document,el=d.documentElement;
 try{if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}
 else{const f=el.requestFullscreen||el.webkitRequestFullscreen;if(f){const p=f.call(el);if(p&&p.catch)p.catch(()=>{})}}}catch(e){}}
let idleT=null;
function wake(){document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add('idle'),2500)}
window.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')wake()});
window.addEventListener('pointerup',e=>{
 const lx=(e.clientX-OX)/SC,ly=(e.clientY-OY)/SC;
 ensureAudio();
 if(Math.hypot(lx-(W-22),ly-20)<=24){setSound(!soundOn);return}
 toggleFs();
});
['touchstart','touchmove','gesturestart','gesturechange'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault()},{passive:false}));
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

/* ================= debug hooks ================= */
window.__bo={
 step(n){const o=FX;FX=false;for(let i=0;i<n;i++)tick(1/60);FX=o},
 stepFx(){tick(1/60)},
 fx(v){FX=!!v},
 seed(s){rnd=mulberry(s);AI.rng=mulberry(s*7+1)},
 goto(n,lives){FX=true;if(lives)G.lives=lives;loadLevel(n)},
 newGame(){newGame()},
 stats:STATS,G,balls:()=>balls,bricks:()=>bricks,
 check(v){STATS.check=!!v},
 render(){render()},
 give(t){applyPower(t)},
 setLives(n){G.lives=n},
 info(){return{state:G.state,lvl:G.lvl,lives:G.lives,score:G.score,req:G.reqLeft,balls:balls.length,levelTime:+G.levelTime.toFixed(1),noProg:+G.noProg.toFixed(1),hi:G.hi,pw:{...G.pw},caps:capsules.length,name:G.def&&G.def.name}},
 acc(){return acc},
 sound(v){setSound(!!v)},
 buildDef,
 loadOnly(n){loadLevel(n)},
 pause(v){hiddenPause=!!v},
 sabotage(v){AI.sab=!!v},
 overlaps(){const out=new Set();const rect=(b)=>[b.x,b.y,b.x+b.w,b.y+b.h];
  for(let t=0;t<40;t+=0.25){setMoversAt(t);
   for(let i=0;i<bricks.length;i++){const a=bricks[i];for(let j=i+1;j<bricks.length;j++){const c=bricks[j];if(a.mv&&a.mv===c.mv)continue;if(!a.mv&&!c.mv&&t>0)continue;
    if(a.x<c.x+c.w&&a.x+a.w>c.x&&a.y<c.y+c.h&&a.y+a.h>c.y)out.add('brick'+i+'-'+j)}
    for(const p of portals){const nx=Math.max(a.x,Math.min(p.x,a.x+a.w)),ny=Math.max(a.y,Math.min(p.y,a.y+a.h));if(Math.hypot(p.x-nx,p.y-ny)<p.r+R*0.5)out.add('portal-brick'+i)}
    for(const p of bumpers){const nx=Math.max(a.x,Math.min(p.x,a.x+a.w)),ny=Math.max(a.y,Math.min(p.y,a.y+a.h));if(Math.hypot(p.x-nx,p.y-ny)<p.r+R*2+2)out.add('bumper-brick'+i)}
    if(a.x<2||a.x+a.w>W-2)out.add('wall'+i)}}
  for(let i=0;i<portals.length;i++)for(let j=i+1;j<portals.length;j++)if(Math.hypot(portals[i].x-portals[j].x,portals[i].y-portals[j].y)<50)out.add('portal-portal');
  for(const p of portals){if(p.y>PY-120||p.x<20||p.x>W-20)out.add('portal-pos')}
  setMoversAt(G.tt);return [...out]},
 lvlInfo(){return{def:G.def,bricks:bricks.length,movers:movers.length}}
};
resize();wake();
newGame();
requestAnimationFrame(frame);
})();
</script>
